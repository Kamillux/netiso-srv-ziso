[package]
name = "netiso-srv"
version = "0.1.3"
edition = "2021"

[features]
default = ["ziso"]
ziso = ["dep:zarchive"]

[dependencies]
binrw = "0.15.0"
glob = "0.3.2"
tokio = { version = "1", features = ["macros", "net", "io-util", "fs", "rt-multi-thread"] }
zarchive = { version = "0.2.0", optional = true }
