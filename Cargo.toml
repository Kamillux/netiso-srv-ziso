[package]
name = "netiso-srv"
version = "0.2.0"
edition = "2021"

[dependencies]
binrw = "0.15"
glob = "0.3"
tokio = { version = "1", features = ["full"] }

# Compressed formats
zarchive = { version = "0.2", optional = true }
chd = { version = "0.3", optional = true, features = ["max_perf"] }
libchdman-rs = { version = "0.289", features = ["prebuilt"], optional = true }

[features]
default = ["ziso", "chd"]
ziso = ["dep:zarchive"]
chd = ["dep:chd"]
chd-create = ["chd", "dep:libchdman-rs"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
[package]
name = "netiso-srv"
version = "0.1.3"
edition = "2021"

[features]
default = ["ziso"]
ziso = ["dep:zarchive"]

[dependencies]
binrw = "0.15.0"
glob = "0.3.2"
tokio = { version = "1", features = ["macros", "net", "io-util", "fs", "rt-multi-thread"] }
zarchive = { version = "0.2.0", optional = true }
