name: Build

on:
  push:
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            aarch64-linux-android,
            aarch64-unknown-linux-musl,
            arm-unknown-linux-musleabi,
            i686-pc-windows-gnu,
            x86_64-pc-windows-gnu,
            i686-unknown-linux-musl,
            x86_64-unknown-linux-musl,
          ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            cross build --release --target ${{ matrix.target }} --no-default-features
          else
            cross build --release --target ${{ matrix.target }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netiso-srv-${{ matrix.target }}
          path: |
            README.md
            target/${{ matrix.target }}/release/netiso-srv*

  build-windows-msvc:
    name: Build (Windows MSVC)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netiso-srv-${{ matrix.target }}
          path: |
            README.md
            target/${{ matrix.target }}/release/netiso-srv.exe

  trigger_docker:
    name: Trigger docker build
    needs: [build, build-windows-msvc]
    if: ${{ success() }}
    uses: ./.github/workflows/docker.yml
    with:
      workflow-run-id: "${{ github.run_id }}"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-windows-msvc]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Zip up builds
        run: for dir in *; do 7z a "${dir}.zip" "${dir}"; done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
